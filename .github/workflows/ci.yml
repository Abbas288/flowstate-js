name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Format, lint and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        id: install
        run: npm ci
      # Each check runs even if an earlier one failed, so one run shows every problem.
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

  # Vitest 5 needs Node.js 22.12 or later, but the module supports Node.js 18 and later.
  # Vitest 2.1.9 still runs on 18 and 20, so it checks the module there without installing the project.
  older-node:
    name: Test (Node ${{ matrix.node }}, Vitest 2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: npx --yes -p vitest@2.1.9 vitest run
